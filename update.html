<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Actualizando</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #e8ddd0;
      --text: #26231f;
      --muted: #7d756c;
      --accent: #b28a3b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161d;
        --text: #eee7dd;
        --muted: #a69d92;
        --accent: #d2b16a;
      }
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.18), transparent 42%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    main {
      width: min(360px, calc(100vw - 40px));
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }
    button {
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: var(--bg);
      padding: 11px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main>
    <h1>Actualizando app</h1>
    <p>La aplicación comprobará la actualización y protegerá tus datos antes de activarla.</p>
    <button id="updateButton" type="button" onclick="forceUpdate()">Actualizar ahora</button>
    <div class="status" id="status">preparando...</div>
  </main>
  <script>
    (() => {
      'use strict';
      const DB_KEY = 'alberto_piano_v2';
      const DB_NAME = 'piano_pre_update_rescue_v1';
      const STORE = 'snapshots';
      const status = document.getElementById('status');
      const button = document.getElementById('updateButton');
      let busy = false;

      const setStatus = message => { status.textContent = message; };
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

      function openRescueDb(){
        return new Promise((resolve,reject) => {
          if(!window.indexedDB){ resolve(null);return; }
          const request=indexedDB.open(DB_NAME,1);
          request.onupgradeneeded=()=>{
            if(!request.result.objectStoreNames.contains(STORE)) request.result.createObjectStore(STORE,{keyPath:'id'});
          };
          request.onsuccess=()=>resolve(request.result);
          request.onerror=()=>reject(request.error||new Error('No se pudo abrir la copia de seguridad'));
          request.onblocked=()=>reject(new Error('La copia de seguridad está bloqueada'));
        });
      }

      async function saveRescue(raw){
        const database=await openRescueDb();
        if(!database) return;
        await new Promise((resolve,reject)=>{
          const tx=database.transaction(STORE,'readwrite');
          tx.objectStore(STORE).put({id:'latest',capturedAt:new Date().toISOString(),raw,recoveryPage:true});
          tx.oncomplete=resolve;
          tx.onerror=()=>reject(tx.error||new Error('No se pudo guardar la copia'));
          tx.onabort=()=>reject(tx.error||new Error('La copia fue cancelada'));
        });
        database.close();
      }

      async function waitingWorker(registration){
        if(registration.waiting) return registration.waiting;
        const worker=registration.installing;
        if(!worker) return null;
        if(worker.state==='installed') return registration.waiting||worker;
        await Promise.race([
          new Promise(resolve=>{
            const check=()=>{ if(worker.state==='installed'||worker.state==='redundant') resolve(); };
            worker.addEventListener('statechange',check);check();
          }),
          wait(15000)
        ]);
        return registration.waiting||(worker.state==='installed'?worker:null);
      }

      function controllerChange(){
        return new Promise(resolve=>{
          let settled=false;
          const finish=value=>{if(settled)return;settled=true;clearTimeout(timer);resolve(value);};
          const timer=setTimeout(()=>finish(false),15000);
          navigator.serviceWorker.addEventListener('controllerchange',()=>finish(true),{once:true});
        });
      }

      window.forceUpdate = async function forceUpdate(){
        if(busy) return false;
        busy=true;button.disabled=true;
        try {
          setStatus('protegiendo copia local…');
          const raw=localStorage.getItem(DB_KEY);
          const parsed=JSON.parse(raw||'null');
          if(!parsed || typeof parsed!=='object') throw new Error('No encuentro una copia local válida');
          await saveRescue(raw);
          if(localStorage.getItem(DB_KEY)!==raw) throw new Error('Los datos cambiaron durante la comprobación');

          setStatus('descargando versión nueva…');
          if(!navigator.serviceWorker) throw new Error('Este navegador no admite la actualización instalada');
          const registration=await navigator.serviceWorker.getRegistration();
          if(!registration) throw new Error('No hay una aplicación instalada que actualizar');
          await registration.update();
          const waiting=await waitingWorker(registration);
          if(!waiting){
            setStatus('versión actual comprobada · reabriendo…');
            location.replace('./?updated=347&t='+Date.now());
            return true;
          }
          if(localStorage.getItem(DB_KEY)!==raw) throw new Error('Los datos cambiaron antes de activar la versión');

          setStatus('activando versión nueva…');
          const changed=controllerChange();
          waiting.postMessage({type:'SAFE_SKIP_WAITING',safe:true,recoveryPage:true,requestedAt:new Date().toISOString()});
          if(!await changed) throw new Error('iOS no terminó de activar la versión');
          setStatus('actualizada · reabriendo…');
          location.replace('./?updated=347&t='+Date.now());
          return true;
        } catch(error) {
          console.warn('[update-page]',error);
          setStatus((error&&error.message)||'No se pudo completar. Cierra la app y prueba de nuevo.');
          button.disabled=false;busy=false;
          return false;
        }
      };
      setStatus('lista para actualizar');
    })();
  </script>
</body>
</html>
