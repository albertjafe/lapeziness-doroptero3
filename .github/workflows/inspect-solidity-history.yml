name: inspect solidity history UI
on:
  push:
    branches: [fix/solidity-history-editor-20260831]
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !startsWith(github.event.head_commit.message, 'Capture solidity UI diagnostics') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture relevant code
        shell: bash
        run: |
          set +o pipefail
          {
            echo '===== APP: PASE / SOLIDEZ ====='
            grep -n -A80 -B30 -E 'function (pasePctToPosition|pasePositionToPct|registerPase|renderPase|renderSolidez|savePase|open.*Solidez|solHistory)|pase-liquid|solHistory|paseHistory' app.js | head -n 2200
            echo '===== STYLES: LIQUID ====='
            grep -n -A70 -B25 -E 'pase-liquid|solidez|pill' styles.css | head -n 1800
            echo '===== INDEX: MODALS ====='
            grep -n -A70 -B25 -E 'paseQ|Solidez|solidez|pase' index.html | head -n 1600
            echo '===== OBRA PREMIUM ====='
            grep -n -A70 -B25 -E 'solidez|Solidez|history|historial' obra-premium.js obra-premium.css | head -n 1600
          } > solidity-ui-diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solidity-ui-diagnostic.txt
          git commit -m "Capture solidity UI diagnostics"
          git push origin HEAD:fix/solidity-history-editor-20260831
