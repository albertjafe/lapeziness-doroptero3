name: inspect pass rating controls
on:
  push:
    branches:
      - fix/pase-rating-scale-inspect
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect liquid meter and defaults
        shell: bash
        run: |
          echo '=== LIQUID METER JS ==='
          grep -n -C 35 -E 'function paseLiquidMeterHtml|function paseLiquidStyle|function updatePaseLiquidMeter|function paseClampPct|function pasePctToLegacyScore|function registerPase|function cronoPaseDraftItem' app.js | head -n 1400 || true
          echo '=== LIQUID CSS ==='
          grep -n -C 30 -E 'pase-liquid-meter|pase-liquid|paseQScoreBtns|crono-pase.*meter' styles.css | head -n 1800 || true
          echo '=== TESTS ==='
          grep -R -n -C 12 -E 'paseLiquid|registerPase|cronoPaseDraftItem|solidezPct.*50' tests | head -n 1000 || true
