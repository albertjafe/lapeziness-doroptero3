name: implement readiness and ipad fix
on:
  push:
    branches:
      - fix/readiness-ipad-landscape-20260829
  workflow_dispatch:
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped readiness and iPad landscape changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text, start, end, replacement, label):
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{label}: start marker not found')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'{label}: end marker not found')
              return text[:a] + replacement.rstrip() + '\n\n' + text[b:]

          # 1) Core: add a true movement-level readiness estimate alongside the whole-work estimate.
          core_path = Path('readiness-core.js')
          core = core_path.read_text()
          export_marker = '  return { estimateReadiness, collectTimeline, realMinutes };\n'
          if export_marker not in core:
              raise SystemExit('readiness-core export marker not found')
          movement_fn = r'''
          function estimateMovementReadiness(db, obraId, movementId, options) {
            const data = db || {};
            const whole = estimateReadiness(data, obraId, options);
            if (!whole || movementId == null) return null;
            const timeline = whole.diagnostics && whole.diagnostics.timeline
              ? whole.diagnostics.timeline
              : collectTimeline(data, obraId);
            const work = timeline && timeline.obra;
            const movements = Array.isArray(work && work.movimientos) ? work.movimientos : [];
            const movement = movements.find(item => idOf(item.id) === idOf(movementId));
            if (!movement) return null;

            const opts = options || {};
            const observedDates = (timeline.practice || []).concat(timeline.checkpoints || []).map(item => item.date).filter(Boolean);
            const latestObserved = observedDates.length ? new Date(Math.max(...observedDates.map(date => date.getTime()))) : null;
            const asOf = dateOf(opts.asOf || opts.now) || latestObserved || new Date();
            const targetScore = num(opts.targetScore, 80);
            const points = (timeline.checkpoints || []).filter(point => idOf(point.movementId) === idOf(movementId));
            const currentScore = points.length ? points[points.length - 1].score : (scoreOf(movement) ?? 0);

            const total = num(movement.compasesTotal || movement.compasTotal || movement.totalBars || movement.bars);
            const current = num(movement.compasActual ?? movement.compasesActual ?? movement.currentBar);
            const explicitCoverage = total > 0 ? clamp(current / total, 0, 1) : null;
            const coverage = explicitCoverage == null
              ? (points.length ? 1 : clamp(currentScore / 100, 0.15, 1))
              : explicitCoverage;

            const datedHigh = points.filter(point => point.score >= targetScore && point.date);
            const distinctHighDates = new Set(datedHigh.map(point => dateKey(point.date))).size;
            const formalHigh = points.some(point => point.kind === 'event' && point.score >= targetScore);
            const stable = formalHigh || distinctHighDates >= 2 || points.some((point, index) =>
              point.score >= targetScore && points.slice(index + 1).some(next =>
                next.date && point.date && (next.date - point.date) >= 5 * DAY && next.score >= targetScore - 5
              )
            );

            let remainingPoints = Math.max(0, targetScore - currentScore);
            if (currentScore >= targetScore && !stable) remainingPoints = Math.max(remainingPoints, 3);
            const familiarity = whole.diagnostics && whole.diagnostics.familiarity;
            if (familiarity && familiarity.recovery) remainingPoints *= 1 - clamp(num(familiarity.prior), 0, 0.6) * 0.35;
            remainingPoints *= 1 + (1 - coverage) * 0.55;

            const inheritedSpeed = whole.diagnostics && whole.diagnostics.speed;
            const speedValue = clamp(num(inheritedSpeed && inheritedSpeed.value, 30), 5, 240);
            let pointEstimateMinutes = Math.max(0, remainingPoints * speedValue);
            const isReady = Boolean(stable && coverage >= 0.8 && currentScore >= targetScore);
            if (isReady) pointEstimateMinutes = 0;

            const movementPractice = (timeline.practice || []).filter(item => idOf(item.movementId) === idOf(movementId));
            const practiceMinutes = movementPractice.reduce((sum, item) => sum + Math.max(0, num(item.minutes)), 0);
            const scores = points.map(point => point.score);
            const volatility = scores.length > 1 ? Math.max(...scores) - Math.min(...scores) : 0;
            const movementObserved = movementPractice.concat(points).map(item => item.date).filter(Boolean);
            const lastMovementDate = movementObserved.length ? new Date(Math.max(...movementObserved.map(date => date.getTime()))) : null;
            const daysSince = lastMovementDate ? Math.max(0, (asOf.getTime() - lastMovementDate.getTime()) / DAY) : 0;

            let confidence = 'low';
            if (points.length >= 4 && movementPractice.length >= 3 && volatility < 25) confidence = 'high';
            else if (points.length >= 1 || practiceMinutes >= 30) confidence = 'medium';
            if (daysSince >= 30) confidence = confidence === 'high' ? 'medium' : 'low';
            if (inheritedSpeed && inheritedSpeed.source === 'fallback' && confidence === 'high') confidence = 'medium';

            const spread = confidence === 'high' ? 0.35 : confidence === 'medium' ? 0.65 : 1.05;
            const stalenessUncertainty = daysSince >= 30 ? 0.3 : daysSince >= 14 ? 0.15 : 0;
            const uncertainty = 1 + volatility / 100 + (1 - coverage) * 0.65 + stalenessUncertainty;
            const lowMinutes = Math.max(0, pointEstimateMinutes * Math.max(0.25, 1 - spread));
            const highMinutes = Math.max(pointEstimateMinutes, pointEstimateMinutes * (1 + spread * uncertainty));

            const recentMinutes = movementPractice.filter(item => item.date && asOf.getTime() - item.date.getTime() >= 0 && asOf.getTime() - item.date.getTime() <= 28 * DAY)
              .reduce((sum, item) => sum + Math.max(0, num(item.minutes)), 0);
            const calendarEstimate = recentMinutes >= 30 && pointEstimateMinutes > 0
              ? { lowDays: Math.max(1, Math.ceil(lowMinutes / (recentMinutes / 28))), highDays: Math.max(1, Math.ceil(highMinutes / (recentMinutes / 28))) }
              : undefined;

            const factors = [];
            if (!points.length) factors.push('estimación inicial del movimiento');
            if (coverage < 0.9) factors.push('cobertura incompleta del movimiento');
            if (stable) factors.push('movimiento estable');

            return {
              scope: 'movement',
              movementId,
              movementName: movement.name || movement.nombre || movement.title || '',
              targetScore,
              rawScore: currentScore,
              effectiveScore: currentScore,
              coverage,
              pointEstimateMinutes: Math.round(pointEstimateMinutes),
              lowMinutes: Math.round(lowMinutes),
              highMinutes: Math.round(highMinutes),
              confidence,
              isReady,
              evidenceCount: points.length,
              calendarEstimate,
              factors,
              diagnostics: {
                timeline,
                movement,
                practiceMinutes,
                movementPracticeCount: movementPractice.length,
                speed: inheritedSpeed || { value: speedValue, source: 'fallback' },
                stable,
                volatility,
                daysSince,
                distinctHighDates,
              },
            };
          }
          '''
          core = core.replace(export_marker, movement_fn + '\n  return { estimateReadiness, estimateMovementReadiness, collectTimeline, realMinutes };\n', 1)
          core_path.write_text(core)

          # 2) App: bundle the movement estimate with the existing whole-work estimate and label both scopes explicitly.
          app_path = Path('app.js')
          app = app_path.read_text()
          readiness_estimator = r'''function cronoReadinessEstimate(selectionValue) {
            if (typeof ReadinessCore === 'undefined' || typeof ReadinessCore.estimateReadiness !== 'function') return null;
            const resolved = cronoResolveSelectValue(selectionValue);
            if (!resolved || !resolved.obraId) return null;
            const obra = findObra(resolved.obraId);
            if (!obra || obra.tipo === 'actividad') return null;
            try {
              const workEstimate = ReadinessCore.estimateReadiness(db, resolved.obraId, { now: new Date() });
              if (!workEstimate) return null;
              const movementId = resolved.movId ?? resolved.movementId ?? resolved.movimientoId ?? null;
              const movementEstimate = movementId != null && typeof ReadinessCore.estimateMovementReadiness === 'function'
                ? ReadinessCore.estimateMovementReadiness(db, resolved.obraId, movementId, { now: new Date() })
                : null;
              return {
                ...workEstimate,
                workEstimate,
                movementEstimate,
                readinessScope: movementEstimate ? 'movement' : 'work',
                selectedMovementId: movementId,
              };
            } catch (e) {
              return null;
            }
          }'''
          app = replace_between(app, 'function cronoReadinessEstimate(selectionValue) {', 'function cronoReadinessHours(estimate) {', readiness_estimator, 'cronoReadinessEstimate')

          readiness_ui = r'''function cronoReadinessScopeLabel(estimate, compact) {
            if (!estimate) return '';
            if (estimate.isReady) return 'estable';
            return '≈ ' + cronoReadinessHours(estimate) + (compact ? '' : ' netas');
          }

          function cronoReadinessMainText(bundle, compact) {
            if (!bundle) return '';
            const workEstimate = bundle.workEstimate || bundle;
            const movementEstimate = bundle.movementEstimate || null;
            if (movementEstimate) {
              return (compact ? 'Mov. ' : 'Movimiento · ') + cronoReadinessScopeLabel(movementEstimate, !!compact)
                + (compact ? ' · Obra ' : ' · Obra completa · ') + cronoReadinessScopeLabel(workEstimate, !!compact);
            }
            return (compact ? 'Obra ' : 'Obra completa · ') + cronoReadinessScopeLabel(workEstimate, !!compact);
          }

          function cronoReadinessConfidenceSummary(bundle, compact) {
            if (!bundle) return '';
            const workEstimate = bundle.workEstimate || bundle;
            const movementEstimate = bundle.movementEstimate || null;
            if (!movementEstimate) return cronoReadinessConfidence(workEstimate.confidence);
            const mov = cronoReadinessConfidence(movementEstimate.confidence).replace('Confianza ', '');
            const work = cronoReadinessConfidence(workEstimate.confidence).replace('Confianza ', '');
            return compact ? ('Mov. ' + mov + ' · obra ' + work) : ('Movimiento: confianza ' + mov + ' · Obra: confianza ' + work);
          }

          function cronoRenderReadinessEstimate() {
            const idleEl = document.getElementById('cronoIdleReadiness');
            const runEl = document.getElementById('cronoRunReadiness');
            const sel = document.getElementById('cronoObraSelect');
            const value = crono.state === 'idle' ? sel?.value : (crono.obraId ? (crono.movId ? 'mov::' + crono.obraId + '::' + crono.movId : 'obra::' + crono.obraId) : '');
            const estimate = value ? cronoReadinessEstimate(value) : null;
            const main = estimate ? cronoReadinessMainText(estimate, false) : '';
            const confidence = estimate ? cronoReadinessConfidenceSummary(estimate, true) : '';
            const movementEstimate = estimate?.movementEstimate || null;
            const workEstimate = estimate?.workEstimate || estimate;
            const fullyReady = !!workEstimate?.isReady && (!movementEstimate || !!movementEstimate.isReady);
            if (idleEl) {
              idleEl.hidden = !estimate;
              idleEl.classList.toggle('is-ready', fullyReady);
              idleEl.classList.toggle('has-movement', !!movementEstimate);
              const mainEl = document.getElementById('cronoIdleReadinessMain');
              const confEl = document.getElementById('cronoIdleReadinessConfidence');
              if (mainEl) mainEl.textContent = main;
              if (confEl) confEl.textContent = confidence;
            }
            if (runEl) {
              runEl.hidden = !estimate;
              runEl.classList.toggle('has-movement', !!movementEstimate);
              runEl.textContent = estimate ? cronoReadinessMainText(estimate, true) : '';
              runEl.title = estimate ? (cronoReadinessConfidenceSummary(estimate, false) + ' · Ver detalle de la estimación') : '';
            }
            return estimate;
          }

          function openCronoReadinessDetail(source) {
            const sel = document.getElementById('cronoObraSelect');
            const value = source === 'running'
              ? (crono.obraId ? (crono.movId ? 'mov::' + crono.obraId + '::' + crono.movId : 'obra::' + crono.obraId) : '')
              : (sel?.value || '');
            const estimate = cronoReadinessEstimate(value);
            const modal = document.getElementById('modalCronoReadiness');
            if (!estimate || !modal) return;
            const resolved = cronoResolveSelectValue(value);
            const obra = resolved && findObra(resolved.obraId);
            const movementId = resolved && (resolved.movId ?? resolved.movementId ?? resolved.movimientoId ?? null);
            const movement = movementId != null && Array.isArray(obra?.movimientos)
              ? obra.movimientos.find(item => String(item.id) === String(movementId))
              : null;
            const workEstimate = estimate.workEstimate || estimate;
            const movementEstimate = estimate.movementEstimate || null;
            const diag = workEstimate.diagnostics || {};
            const timeline = diag.timeline || {};
            const sessions = new Set((timeline.practice || []).map(item => item.sessionId).filter(Boolean)).size;
            const passes = (timeline.checkpoints || []).filter(item => item.kind === 'pass').length;
            const evidence = [];
            if (sessions) evidence.push(sessions + (sessions === 1 ? ' sesión' : ' sesiones'));
            if (passes) evidence.push(passes + (passes === 1 ? ' pase' : ' pases'));
            if (workEstimate.rawScore != null) evidence.push('obra: último nivel ' + Math.round(workEstimate.rawScore));
            if (workEstimate.factors?.length) evidence.push(...workEstimate.factors);
            if (movementEstimate) {
              const movementDiag = movementEstimate.diagnostics || {};
              const movementPoints = movementEstimate.evidenceCount || 0;
              const movementMinutes = Math.round(movementDiag.practiceMinutes || 0);
              evidence.push('movimiento: ' + movementPoints + (movementPoints === 1 ? ' medición' : ' mediciones') + (movementMinutes ? ' · ' + movementMinutes + ' min registrados' : ''));
            }
            const title = document.getElementById('cronoReadinessTitle');
            const lead = document.getElementById('cronoReadinessLead');
            const conf = document.getElementById('cronoReadinessDetailConfidence');
            const copy = document.getElementById('cronoReadinessCopy');
            const evidenceEl = document.getElementById('cronoReadinessEvidence');
            const calendar = document.getElementById('cronoReadinessCalendar');
            const movementName = movementEstimate?.movementName || movement?.name || movement?.nombre || movement?.title || 'Movimiento';
            if (title) title.textContent = movementEstimate ? ((obra?.name || 'Obra') + ' · ' + movementName) : (obra?.name || 'A punto');
            if (lead) lead.textContent = cronoReadinessMainText(estimate, false);
            if (conf) conf.textContent = cronoReadinessConfidenceSummary(estimate, false);
            if (copy) {
              if (movementEstimate) {
                copy.textContent = movementName + ': nivel ' + Math.round(movementEstimate.effectiveScore || 0) + '/100 · cobertura ' + Math.round((movementEstimate.coverage || 0) * 100)
                  + '%. Obra completa: nivel ' + Math.round(workEstimate.effectiveScore || 0) + '/100 · cobertura ' + Math.round((workEstimate.coverage || 0) * 100)
                  + '%. Ambos rangos son esfuerzo neto para poner a punto, no una fecha exacta.';
              } else {
                copy.textContent = 'Nivel efectivo actual: ' + Math.round(workEstimate.effectiveScore || 0) + '/100 · objetivo 80 · cobertura ' + Math.round((workEstimate.coverage || 0) * 100) + '%. La cifra es un rango de esfuerzo neto, no una fecha exacta.';
              }
            }
            if (evidenceEl) evidenceEl.textContent = evidence.length ? 'Basado en ' + evidence.join(' · ') + '.' : 'Estimación inicial · aún hay poca evidencia personal.';
            if (calendar) {
              const cal = workEstimate.calendarEstimate;
              calendar.hidden = !cal;
              calendar.textContent = cal ? 'Obra completa, a tu ritmo reciente · ~' + cal.lowDays + '–' + cal.highDays + ' días' : '';
            }
            openModal('modalCronoReadiness');
          }'''
          app = replace_between(app, 'function cronoRenderReadinessEstimate() {', 'function cronoTargetReached() {', readiness_ui, 'readiness UI block')
          app_path.write_text(app)

          # 3) Active stylesheet: stop stacking controls vertically on iPad landscape.
          styles_path = Path('styles.css')
          styles = styles_path.read_text()
          ipad_css = r'''

          /* Cronómetro parado · iPad horizontal: usar el ancho, no comprimir la altura. */
          .crono-idle-controls .crono-mode-toggle,
          [data-theme^="marmol"] .crono-idle-controls .crono-mode-toggle {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }

          @media (min-width: 900px) and (max-width: 1399px) and (orientation: landscape) and (min-height: 700px) and (max-height: 950px) {
            [data-theme^="marmol"] #view-cronometro .crono-idle-console {
              grid-template-columns: minmax(0, 1.12fr) minmax(340px, .88fr) !important;
              gap: 18px !important;
              align-items: stretch !important;
            }
            [data-theme^="marmol"] #view-cronometro #cronoStageIdle .crono-idle-main,
            [data-theme^="marmol"] #view-cronometro #cronoIdleDrawer {
              min-height: 0 !important;
              height: min(650px, calc(100dvh - 108px)) !important;
            }
            [data-theme^="marmol"] #view-cronometro #cronoStageIdle .crono-idle-main {
              padding: 12px 16px 14px !important;
              overflow: hidden !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main > .crono-readiness-chip {
              width: min(460px, calc(100% - 22px)) !important;
              min-height: 34px !important;
              margin: 4px auto 7px !important;
              padding: 6px 11px !important;
              gap: 7px !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-readiness-chip-main {
              font-size: 11px !important;
              line-height: 1.25 !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-readiness-chip-confidence {
              font-size: 9px !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-display-wrap,
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-centerpiece,
            [data-theme^="marmol"] body.crono-timer-mode #view-cronometro .crono-idle-main .crono-centerpiece {
              width: min(320px, 42dvh) !important;
              height: min(320px, 42dvh) !important;
              max-height: none !important;
              flex: 0 0 auto !important;
              margin: 1px auto 4px !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-idle-message {
              width: min(460px, 100%) !important;
              min-height: 42px !important;
              margin: 5px auto 7px !important;
              padding: 8px 12px !important;
              font-size: 13px !important;
              line-height: 1.3 !important;
              -webkit-line-clamp: 2 !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-idle-controls {
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) minmax(138px, .46fr) !important;
              grid-template-areas: "mode start" "projection projection" !important;
              column-gap: 10px !important;
              row-gap: 7px !important;
              width: min(470px, 100%) !important;
              margin: auto auto 0 !important;
              padding-top: 8px !important;
              align-items: stretch !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-mode-toggle {
              grid-area: mode !important;
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              width: 100% !important;
              min-height: 48px !important;
              height: auto !important;
              margin: 0 !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-mode-opt {
              min-height: 42px !important;
              height: auto !important;
              padding: 7px 8px !important;
              font-size: 12px !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-timer-projection {
              grid-area: projection !important;
              width: 100% !important;
              max-width: none !important;
              margin: 0 !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-plant-btn {
              grid-area: start !important;
              width: 100% !important;
              min-width: 0 !important;
              min-height: 48px !important;
              height: auto !important;
              margin: 0 !important;
              padding: 9px 14px !important;
              font-size: 16px !important;
              z-index: 1 !important;
            }
          }
          '''
          if 'Cronómetro parado · iPad horizontal: usar el ancho' not in styles:
              styles += ipad_css
          styles_path.write_text(styles)

          # 4) Cache-bust the three files actually changed/consumed by index.html.
          index_path = Path('index.html')
          index = index_path.read_text()
          for old, new in [
              ('styles.css?v=278', 'styles.css?v=279'),
              ('readiness-core.js?v=1', 'readiness-core.js?v=2'),
              ('app.js?v=278', 'app.js?v=279'),
          ]:
              if old not in index:
                  raise SystemExit(f'index cache marker not found: {old}')
              index = index.replace(old, new, 1)
          index_path.write_text(index)

          # 5) Unit coverage for a movement estimate distinct from the whole work.
          unit_path = Path('tests/unit/readiness-core.test.js')
          unit = unit_path.read_text()
          unit_test = r'''

            it('estimates the selected movement separately from the whole work', () => {
              const movements = [
                { id: 'one', name: 'I', sol: 7, compasesTotal: 100, compasActual: 100, solHistory: [{ val: 70, date: '2026-08-20' }] },
                { id: 'two', name: 'II', sol: 3, compasesTotal: 100, compasActual: 100, solHistory: [{ val: 30, date: '2026-08-20' }] },
              ];
              const data = dbWith(obra({ sol: 50, compasesTotal: 200, compasActual: 200, movimientos: movements }), [
                { id: 's1', date: '2026-08-20', items: [item('2026-08-20T10:00:00Z', 45, { movId: 'one', solRating: 70 })] },
              ]);
              const whole = Readiness.estimateReadiness(data, 'bach', { now: new Date('2026-08-21T10:00:00Z') });
              const movement = Readiness.estimateMovementReadiness(data, 'bach', 'one', { now: new Date('2026-08-21T10:00:00Z') });
              expect(movement.scope).toBe('movement');
              expect(movement.movementId).toBe('one');
              expect(movement.rawScore).toBe(70);
              expect(movement.pointEstimateMinutes).toBeGreaterThan(0);
              expect(movement.pointEstimateMinutes).toBeLessThan(whole.pointEstimateMinutes);
              expect(movement.lowMinutes).toBeLessThanOrEqual(movement.pointEstimateMinutes);
              expect(movement.highMinutes).toBeGreaterThanOrEqual(movement.pointEstimateMinutes);
            });
          '''
          if "estimates the selected movement separately from the whole work" not in unit:
              cut = unit.rfind('\n});')
              if cut < 0:
                  raise SystemExit('unit suite closing marker not found')
              unit = unit[:cut] + unit_test + unit[cut:]
          unit_path.write_text(unit)

          # 6) Browser regression: both values visible and no overlap at iPad 11 landscape dimensions.
          e2e = r'''import { test, expect } from '@playwright/test';

          const fixture = {
            obras: [{
              id: 'bach', name: 'Bach · Suite', composer: 'J. S. Bach', tipo: 'obra', sol: 50,
              compasesTotal: 200, compasActual: 200,
              movimientos: [
                { id: 'm1', name: 'I. Preludio', sol: 70, compasesTotal: 100, compasActual: 100, solHistory: [{ val: 70, date: '2026-08-20' }] },
                { id: 'm2', name: 'II. Danza', sol: 35, compasesTotal: 100, compasActual: 100, solHistory: [{ val: 35, date: '2026-08-20' }] },
              ],
              solHistory: [{ val: 50, date: '2026-08-20' }],
            }],
            eventos: [], sesiones: [], registro: [], sessionPlants: [], forestPlants: [], estadoEventos: [], impulsoEventos: [],
            deporteEventos: [], suenoEventos: [], triggerEventos: [], tiempoDisponibleEventos: [], dailyJournalEntries: [],
          };

          test('iPad landscape idle timer shows movement + work readiness without overlapping controls', async ({ page }) => {
            await page.setViewportSize({ width: 1194, height: 834 });
            await page.route('https://cdn.jsdelivr.net/**', route => route.fulfill({ status: 200, contentType: 'application/javascript', body: '/* offline test */' }));
            await page.addInitScript(data => localStorage.setItem('alberto_piano_v2', JSON.stringify(data)), fixture);
            await page.goto('/', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(700);
            await page.evaluate(() => {
              showView('cronometro');
              const select = document.getElementById('cronoObraSelect');
              select.value = 'mov::bach::m1';
              select.dispatchEvent(new Event('change', { bubbles: true }));
              cronoRenderReadinessEstimate();
            });

            const main = page.locator('#cronoIdleReadinessMain');
            await expect(main).toContainText('Movimiento');
            await expect(main).toContainText('Obra completa');

            const geometry = await page.evaluate(() => {
              const box = selector => {
                const el = document.querySelector(selector);
                const r = el.getBoundingClientRect();
                return { x: r.x, y: r.y, width: r.width, height: r.height, right: r.right, bottom: r.bottom };
              };
              const overlap = (a, b) => a.x < b.right && a.right > b.x && a.y < b.bottom && a.bottom > b.y;
              const mode = box('#cronoModeToggle');
              const start = box('#cronoStartBtn');
              const ring = box('#cronoIdleDisplayWrap');
              const message = box('#cronoIdleMessage');
              const readiness = box('#cronoIdleReadiness');
              return {
                mode, start, ring, message, readiness,
                modeStartOverlap: overlap(mode, start),
                ringMessageOverlap: overlap(ring, message),
                readinessRingOverlap: overlap(readiness, ring),
                columns: getComputedStyle(document.querySelector('#cronoModeToggle')).gridTemplateColumns.split(' ').filter(Boolean).length,
              };
            });

            expect(geometry.modeStartOverlap).toBe(false);
            expect(geometry.ringMessageOverlap).toBe(false);
            expect(geometry.readinessRingOverlap).toBe(false);
            expect(geometry.columns).toBe(2);
            expect(geometry.ring.width).toBeGreaterThanOrEqual(280);
            expect(geometry.start.width).toBeGreaterThanOrEqual(130);
            expect(geometry.mode.height).toBeGreaterThanOrEqual(44);
          });
