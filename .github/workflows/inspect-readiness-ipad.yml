name: inspect readiness and ipad ui
on:
  push:
    branches:
      - fix/readiness-ipad-landscape-20260829
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Readiness UI references
        shell: bash
        run: |
          set -u
          echo '=== APP READINESS ==='
          grep -n -C 14 -E 'ReadinessCore|estimateReadiness|crono-readiness|readiness-chip|poner a punto|Poner a punto|pointEstimateMinutes|lowMinutes|highMinutes' app.js | head -n 900 || true
          echo '=== INDEX READINESS + ASSETS ==='
          grep -n -C 8 -E 'crono-readiness|readiness-pill|readiness-core|crono-idle-hierarchy|crono-readiness-layout|app\.js' index.html | head -n 700 || true
          echo '=== PILL MODEL MOVEMENTS ==='
          grep -n -C 10 -E 'movementState|measuredMovements|pointEstimateMinutes|estimateReadiness' readiness-pill-model.js | head -n 700 || true
      - name: Timer layout references
        shell: bash
        run: |
          set -u
          echo '=== APP TIMER DOM ==='
          grep -n -C 14 -E 'crono-idle-main|crono-idle-controls|crono-mode-toggle|crono-plant-btn|cronoIdleDrawer|cronoStageIdle|crono-idle-action-rail' app.js index.html | head -n 1000 || true
          echo '=== TIMER CSS ==='
          grep -n -C 18 -E 'crono-idle-main|crono-idle-controls|crono-mode-toggle|crono-plant-btn|cronoIdleDrawer|cronoStageIdle|1194|orientation: landscape' crono-idle-hierarchy.css crono-readiness-layout.css styles.css | head -n 1400 || true
