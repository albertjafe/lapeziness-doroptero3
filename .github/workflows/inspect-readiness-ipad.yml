name: inspect readiness and ipad ui
on:
  push:
    branches:
      - fix/readiness-ipad-landscape-20260829
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Readiness render detail
        shell: bash
        run: |
          echo '=== READINESS RENDER ==='
          sed -n '24770,24945p' app.js
          echo '=== MODE MUTATIONS ==='
          grep -n -C 8 -E 'crono-mode-opt|cronoModeToggle|insertAdjacentHTML|appendChild.*mode|Pomodoro' app.js | head -n 600 || true
      - name: Asset order and tests
        shell: bash
        run: |
          echo '=== CSS ORDER ==='
          grep -n -E '<link[^>]+href=.*(styles|crono)[^>]*\.css' index.html || true
          echo '=== SCRIPT ORDER ==='
          grep -n -E '<script[^>]+src=.*(solidity|readiness|app\.js)' index.html || true
          echo '=== PACKAGE ==='
          cat package.json 2>/dev/null || true
          echo '=== TEST FILES ==='
          find . -maxdepth 3 -type f \( -name '*test*.js' -o -name '*spec*.js' -o -name '*playwright*' \) | sort | head -n 250
          echo '=== IPAD ASSETS ==='
          find . -maxdepth 4 -type f | grep -Ei 'ipad|landscape|screenshot' | head -n 250 || true
