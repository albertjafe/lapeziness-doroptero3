name: inspect ipad landscape geometry
on:
  push:
    branches:
      - fix/readiness-ipad-landscape-20260829
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Measure current landscape layout
        shell: bash
        run: |
          cat > tests/e2e/_inspect-ipad-geometry.spec.js <<'JS'
          import { test } from '@playwright/test';
          const fixture = {
            obras: [{ id: 'bach', name: 'Bach', composer: 'Bach', tipo: 'obra', sol: 50, compasesTotal: 100, compasActual: 100, movimientos: [] }],
            eventos: [], sesiones: [], registro: [], sessionPlants: [], forestPlants: [], estadoEventos: [], impulsoEventos: [], deporteEventos: [], suenoEventos: [], triggerEventos: [], tiempoDisponibleEventos: [], dailyJournalEntries: [],
          };
          for (const vp of [{width:1366,height:1024},{width:1194,height:834}]) {
            test(`geometry ${vp.width}x${vp.height}`, async ({ page }) => {
              await page.setViewportSize(vp);
              await page.route('https://cdn.jsdelivr.net/**', route => route.fulfill({status:200, contentType:'application/javascript', body:'/* offline */'}));
              await page.addInitScript(data => localStorage.setItem('alberto_piano_v2', JSON.stringify(data)), fixture);
              await page.goto('/', {waitUntil:'domcontentloaded'});
              await page.waitForTimeout(500);
              await page.evaluate(() => { showView('cronometro'); cronoRenderReadinessEstimate?.(); });
              const result = await page.evaluate(() => {
                const sels = ['#view-cronometro','.crono-wrap','#cronoStageIdle','.crono-idle-console','.crono-idle-main','#cronoIdleDrawer','#cronoModeToggle','#cronoStartBtn'];
                const rect = el => { const r=el.getBoundingClientRect(); const s=getComputedStyle(el); return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom,display:s.display,position:s.position,overflow:s.overflow,gridRows:s.gridTemplateRows,gridCols:s.gridTemplateColumns,gridArea:s.gridArea,heightStyle:s.height,minHeight:s.minHeight,maxHeight:s.maxHeight}; };
                const out = {};
                for (const sel of sels) { const el=document.querySelector(sel); out[sel]=el?rect(el):null; }
                const wrap=document.querySelector('.crono-wrap');
                out.children = wrap ? [...wrap.children].map(el=>({id:el.id,cls:el.className, ...rect(el)})) : [];
                const main=document.querySelector('.crono-idle-main');
                const drawer=document.querySelector('#cronoIdleDrawer');
                out.mainDrawerOverlap = main && drawer ? !(main.getBoundingClientRect().bottom <= drawer.getBoundingClientRect().top || drawer.getBoundingClientRect().bottom <= main.getBoundingClientRect().top || main.getBoundingClientRect().right <= drawer.getBoundingClientRect().left || drawer.getBoundingClientRect().right <= main.getBoundingClientRect().left) : null;
                return out;
              });
              console.log(`\n=== ${vp.width}x${vp.height} ===\n` + JSON.stringify(result,null,2));
            });
          }
          JS
          npx playwright test tests/e2e/_inspect-ipad-geometry.spec.js --project=chromium --reporter=line
