name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# La batería E2E tardaba ~11 min en una sola máquina. Se reparte en 4 trozos
# que corren a la vez; cada trozo sigue con un solo proceso (workers: 1 en
# CI, ver playwright.config.js), así que las pruebas con tiempos reales
# siguen siendo deterministas.
jobs:
  static:
    name: check + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  e2e:
    name: e2e ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      # Un trozo que falla no cancela los demás: se ven todos los fallos a la vez.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e --shard=${{ matrix.shard }}/4
      - name: Keep Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  visual:
    name: visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Keep Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual
          path: test-results/
          retention-days: 14
