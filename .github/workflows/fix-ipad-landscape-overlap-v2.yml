name: fix ipad landscape parent layout
on:
  push:
    branches:
      - fix/readiness-ipad-landscape-20260829
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply parent-grid landscape fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          raw = path.read_bytes()
          old_marker = '/* Cronómetro parado · iPad horizontal: usar el ancho, no comprimir la altura. */'.encode()
          new_marker = '/* Cronómetro parado · iPad horizontal: filas sin solape. */'.encode()
          positions = [p for p in (raw.find(old_marker), raw.find(new_marker)) if p >= 0]
          if not positions:
              raise SystemExit('landscape marker not found')
          cut = min(positions)
          prefix = raw[:cut].rstrip(b'\r\n')
          nearby = raw[max(0, cut-5000):cut]
          eol = b'\r\n' if nearby.count(b'\r\n') > nearby.count(b'\n') - nearby.count(b'\r\n') else b'\n'
          css = r'''/* Cronómetro parado · iPad horizontal: filas sin solape. */
          @media (min-width: 900px) and (max-width: 1399px) and (min-height: 700px) and (max-height: 1100px) and (orientation: landscape) and (min-aspect-ratio: 4/3) and (max-aspect-ratio: 3/2) {
            [data-theme^="marmol"] #view-cronometro .crono-wrap,
            [data-theme^="marmol"] body.crono-running #view-cronometro .crono-wrap {
              grid-template-rows: 500px 185px auto !important;
              align-content: center !important;
            }
            [data-theme^="marmol"] #view-cronometro #cronoStageIdle .crono-idle-main,
            [data-theme^="marmol"] #view-cronometro #cronoIdleDrawer,
            [data-theme^="marmol"] #view-cronometro #cronoCalendarObjectivesShell {
              height: 100% !important;
              min-height: 0 !important;
              max-height: none !important;
              box-sizing: border-box !important;
            }
            [data-theme^="marmol"] #view-cronometro #cronoStageIdle .crono-idle-main {
              padding: 10px 16px 12px !important;
              overflow: hidden !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-display-wrap,
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-centerpiece,
            [data-theme^="marmol"] body.crono-timer-mode #view-cronometro .crono-idle-main .crono-centerpiece {
              width: min(285px, 35dvh) !important;
              height: min(285px, 35dvh) !important;
              max-height: none !important;
              flex: 0 0 auto !important;
              margin: 0 auto 2px !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-idle-message {
              width: min(460px, 100%) !important;
              min-height: 36px !important;
              margin: 2px auto 4px !important;
              padding: 6px 10px !important;
              font-size: 12px !important;
              line-height: 1.25 !important;
              -webkit-line-clamp: 2 !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-idle-controls {
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) minmax(138px, .46fr) !important;
              grid-template-areas: "mode start" "projection projection" !important;
              column-gap: 10px !important;
              row-gap: 5px !important;
              width: min(470px, 100%) !important;
              margin: auto auto 0 !important;
              padding-top: 4px !important;
              align-items: stretch !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-mode-toggle {
              grid-area: mode !important;
              grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
              width: 100% !important;
              min-height: 44px !important;
              height: auto !important;
              margin: 0 !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-mode-opt {
              min-height: 38px !important;
              height: auto !important;
              padding: 6px 8px !important;
              font-size: 12px !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-timer-projection {
              grid-area: projection !important;
              width: 100% !important;
              max-width: none !important;
              margin: 0 !important;
            }
            [data-theme^="marmol"] #view-cronometro .crono-idle-main .crono-plant-btn {
              grid-area: start !important;
              width: 100% !important;
              min-width: 0 !important;
              min-height: 44px !important;
              height: auto !important;
              margin: 0 !important;
              padding: 7px 13px !important;
              font-size: 15px !important;
              z-index: 1 !important;
            }
          }
          @media (min-width: 900px) and (max-width: 1399px) and (min-height: 700px) and (max-height: 899px) and (orientation: landscape) and (min-aspect-ratio: 4/3) and (max-aspect-ratio: 3/2) {
            [data-theme^="marmol"] #view-cronometro .crono-wrap,
            [data-theme^="marmol"] body.crono-running #view-cronometro .crono-wrap {
              grid-template-rows: 500px 250px auto !important;
            }
          }
          '''.strip() + '\n'
          path.write_bytes(prefix + eol + eol + css.encode().replace(b'\n', eol))
          index = Path('index.html').read_bytes()
          if b'styles.css?v=279' in index:
              index = index.replace(b'styles.css?v=279', b'styles.css?v=280', 1)
          elif b'styles.css?v=280' not in index:
              raise SystemExit('styles cache marker not found')
          Path('index.html').write_bytes(index)
          PY
          cat > tests/e2e/crono-ipad-parent-overlap.spec.js <<'JS'
          import { test, expect } from '@playwright/test';
          const fixture = {
            obras: [{ id:'bach', name:'Bach', composer:'Bach', tipo:'obra', sol:50, compasesTotal:100, compasActual:100, movimientos:[] }],
            eventos:[], sesiones:[], registro:[], sessionPlants:[], forestPlants:[], estadoEventos:[], impulsoEventos:[], deporteEventos:[], suenoEventos:[], triggerEventos:[], tiempoDisponibleEventos:[], dailyJournalEntries:[],
          };
          for (const viewport of [{width:1194,height:834},{width:1366,height:1024}]) {
            test(`idle landscape parent geometry ${viewport.width}x${viewport.height}`, async ({page}) => {
              await page.setViewportSize(viewport);
              await page.route('https://cdn.jsdelivr.net/**', route => route.fulfill({status:200, contentType:'application/javascript', body:'/* offline */'}));
              await page.addInitScript(data => localStorage.setItem('alberto_piano_v2', JSON.stringify(data)), fixture);
              await page.goto('/', {waitUntil:'domcontentloaded'});
              await page.waitForTimeout(600);
              await page.evaluate(() => showView('cronometro'));
              const g = await page.evaluate(() => {
                const box = sel => { const r=document.querySelector(sel).getBoundingClientRect(); return {x:r.x,y:r.y,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}; };
                const overlap=(a,b)=>a.x<b.right&&a.right>b.x&&a.top<b.bottom&&a.bottom>b.top;
                const main=box('.crono-idle-main'), drawer=box('#cronoIdleDrawer'), mode=box('#cronoModeToggle'), start=box('#cronoStartBtn'), ring=box('#cronoIdleDisplayWrap'), view=box('#view-cronometro');
                return {main,drawer,mode,start,ring,view,modeDrawer:overlap(mode,drawer),startDrawer:overlap(start,drawer),columns:getComputedStyle(document.querySelector('#cronoModeToggle')).gridTemplateColumns.split(' ').filter(Boolean).length};
              });
              expect(g.modeDrawer).toBe(false);
              expect(g.startDrawer).toBe(false);
              expect(g.mode.bottom).toBeLessThanOrEqual(g.main.bottom + 1);
              expect(g.start.bottom).toBeLessThanOrEqual(g.main.bottom + 1);
              expect(g.drawer.top).toBeGreaterThanOrEqual(g.main.bottom + 8);
              expect(g.drawer.bottom).toBeLessThanOrEqual(g.view.bottom + 1);
              expect(g.columns).toBe(2);
              expect(g.ring.width).toBeGreaterThanOrEqual(270);
              expect(g.main.height).toBeGreaterThanOrEqual(490);
            });
          }
          JS
      - run: npm ci
      - name: Validate
        shell: bash
        run: |
          node --check app.js
          node --check readiness-core.js
          npx vitest run tests/unit/readiness-core.test.js
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/crono-readiness-ipad.spec.js tests/e2e/crono-ipad-parent-overlap.spec.js --project=chromium
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html tests/e2e/crono-ipad-parent-overlap.spec.js
          git commit -m "Fix parent layout on iPad landscape"
          git push origin HEAD:fix/readiness-ipad-landscape-20260829
