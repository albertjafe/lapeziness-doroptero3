name: Inspect E2E implementation

on:
  push:
    branches: [fix/e2e-quality-20260828]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining E2E failures
        shell: bash
        run: |
          set -euo pipefail
          context() {
            file="$1"; term="$2"; before="${3:-45}"; after="${4:-100}"
            line=$(grep -n -m1 -F "$term" "$file" | cut -d: -f1 || true)
            if [ -n "$line" ]; then
              start=$(( line > before ? line - before : 1 )); end=$(( line + after ))
              echo "--- $file :: $term @ $line ---"
              sed -n "${start},${end}p" "$file"
            else
              echo "--- NOT FOUND: $file :: $term ---"
            fi
          }
          echo '=== state/storage ==='
          grep -RniE 'pianoAppDB_v2|alberto_piano_v2|const DB|let DB|var DB|function openModal' --include='*.js' --include='*.html' . | head -120 || true
          context app.js 'function pulseTrimmerPointerDown' 35 170
          context app.js 'function pulseTrimmerTrackPointerDown' 35 110
          context app.js 'function cronoTaskPressStart' 25 110
          context app.js 'function openModal' 20 70
          context crono-idle-hierarchy.css '@media' 5 230
          echo '=== landscape / challenge CSS candidates ==='
          grep -nE '@media|crono-plant-btn|crono-idle-main|crono-idle-display-wrap|crono-idle-controls' crono-idle-hierarchy.css || true
          sed -n '1,240p' crono-idle-hierarchy.css
