name: Inspect E2E implementation

on:
  push:
    branches: [fix/e2e-quality-20260828]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect short landscape timer CSS
        shell: bash
        run: |
          set -euo pipefail
          echo '=== landscape media rules in styles.css ==='
          grep -nEi '@media.*landscape|landscape.*@media' styles.css || true
          echo '=== timer/challenge rules mentioning short dimensions ==='
          grep -nEi 'max-height: *([3-8][0-9]{2})px|min-height: *([3-8][0-9]{2})px|crono-habit|crono-idle-display-wrap|crono-centerpiece' styles.css | tail -260 || true
          echo '=== contexts for landscape media rules ==='
          while IFS=: read -r line rest; do
            [ -n "$line" ] || continue
            start=$(( line > 12 ? line - 12 : 1 )); end=$(( line + 150 ))
            echo "--- styles.css:$line ---"
            sed -n "${start},${end}p" styles.css
          done < <(grep -nEi '@media.*landscape|landscape.*@media' styles.css || true)
