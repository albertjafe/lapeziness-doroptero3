name: Apply guarded E2E migration

on:
  push:
    branches: [fix/e2e-quality-20260828]

permissions:
  contents: write

jobs:
  rewrite:
    if: ${{ !contains(github.event.head_commit.message, '[e2e-rewrite]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/e2e-quality-20260828
      - name: Apply exact E2E replacements
        run: node scripts/repair-e2e-spec.cjs
      - name: Commit migrated spec
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/app.spec.js
          git commit -m "Refresh obsolete E2E expectations [e2e-rewrite]"
          git push origin HEAD:fix/e2e-quality-20260828
