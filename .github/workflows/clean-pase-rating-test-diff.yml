name: clean pass rating test diff
on:
  push:
    branches:
      - fix/pase-rating-scale-20260829
permissions:
  contents: write
jobs:
  clean:
    if: ${{ !startsWith(github.event.head_commit.message, 'Preserve test line endings for nonlinear rating') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild app test from exact main bytes
        shell: bash
        run: |
          git checkout origin/main -- tests/e2e/app.spec.js
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/app.spec.js')
          raw = p.read_bytes()

          def replace_any(old_text, new_text, label):
              global raw
              for eol in (b'\r\n', b'\n'):
                  old = old_text.replace('\n', eol.decode()).encode('utf-8')
                  if old in raw:
                      new = new_text.replace('\n', eol.decode()).encode('utf-8')
                      raw = raw.replace(old, new, 1)
                      return
              raise SystemExit(label + ': source snippet not found')

          replace_any(
            "  await stable.fill('65');\n  await expect(stable).toHaveValue('65');",
            "  const position65 = await page.evaluate(() => pasePctToPosition(65).toFixed(2));\n  await stable.fill(position65);\n  await expect(stable).toHaveAttribute('data-pase-value', '65');",
            'session 65')
          replace_any(
            "  await page.locator('.crono-pase-item').first().locator('.pase-liquid-input').fill('82');",
            "  const position82 = await page.evaluate(() => pasePctToPosition(82).toFixed(2));\n  await page.locator('.crono-pase-item').first().locator('.pase-liquid-input').fill(position82);",
            'recording 82')
          replace_any(
            "  await page.locator('.crono-pase-item').first().locator('.pase-liquid-input').fill('76');",
            "  const position76 = await page.evaluate(() => pasePctToPosition(76).toFixed(2));\n  await page.locator('.crono-pase-item').first().locator('.pase-liquid-input').fill(position76);",
            'competition 76')
          replace_any(
            "  await page.locator('.crono-pase-item .pase-liquid-input').fill('74');",
            "  const position74 = await page.evaluate(() => pasePctToPosition(74).toFixed(2));\n  await page.locator('.crono-pase-item .pase-liquid-input').fill(position74);",
            'fault map 74')
          replace_any(
            "  await page.locator('#cronoPaseItems .crono-pase-item').nth(firstPassIndices[0]).locator('.pase-liquid-input').fill('18');\n  await page.locator('#cronoPaseItems .crono-pase-item').nth(firstPassIndices[1]).locator('.pase-liquid-input').fill('61');\n  await page.locator('#cronoPaseItems .crono-pase-item').nth(firstPassIndices[2]).locator('.pase-liquid-input').fill('97');",
            "  const passPositions = await page.evaluate(() => [18, 61, 97].map(value => pasePctToPosition(value).toFixed(2)));\n  await page.locator('#cronoPaseItems .crono-pase-item').nth(firstPassIndices[0]).locator('.pase-liquid-input').fill(passPositions[0]);\n  await page.locator('#cronoPaseItems .crono-pase-item').nth(firstPassIndices[1]).locator('.pase-liquid-input').fill(passPositions[1]);\n  await page.locator('#cronoPaseItems .crono-pase-item').nth(firstPassIndices[2]).locator('.pase-liquid-input').fill(passPositions[2]);",
            'repeated passes')
          replace_any(
            "  await page.locator('#paseQPercent').fill('84');",
            "  const position84 = await page.evaluate(() => pasePctToPosition(84).toFixed(2));\n  await page.locator('#paseQPercent').fill(position84);",
            'edit 84')
          p.write_bytes(raw)
          PY
          git diff --numstat origin/main -- tests/e2e/app.spec.js
          python - <<'PY'
          import subprocess
          line = subprocess.check_output(['git','diff','--numstat','origin/main','--','tests/e2e/app.spec.js'], text=True).strip()
          a,d,_ = line.split('\t')
          total = int(a) + int(d)
          print('Logical changed lines:', total)
          if total > 30:
              raise SystemExit('app.spec.js diff still too large')
          PY
      - name: Validate affected scenarios
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/pase-rating-scale.spec.js --project=chromium
          npx playwright test tests/e2e/app.spec.js --project=chromium --grep "cancels or confirms a valid timer|records recording passes|keeps competition passes|configures a work map|keeps the pass save action|edits a previous pass"
      - name: Commit clean test diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/app.spec.js
          git commit -m "Preserve test line endings for nonlinear rating"
          git push origin HEAD:fix/pase-rating-scale-20260829
