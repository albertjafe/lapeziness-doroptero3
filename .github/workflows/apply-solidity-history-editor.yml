name: validate solidity history editor
on:
  push:
    branches: [fix/solidity-history-editor-20260831]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Integrate editable solidity history') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration patch
        run: python scripts/apply_solidity_history_patch.py
      - name: Inspect diff
        run: |
          git diff --stat
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Static and unit validation
        run: |
          node --check solidity-model.js
          node --check obra-premium.js
          node --check solidity-history-editor.js
          node --check pase-liquid-direct-touch.js
          npm run check
          npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Interaction regression tests
        run: |
          npx playwright test tests/e2e/solidity-history-editor.spec.js --project=chromium
          npx playwright test tests/visual/pase-liquid.spec.js --project=chromium
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solidity-model.js obra-premium.js solidity-history-editor.js tests/unit/solidity-model.test.js
          git commit -m "Integrate editable solidity history"
          git push origin HEAD:fix/solidity-history-editor-20260831
