name: validate cronometro resume layout
on:
  push:
    branches:
      - fix/crono-stale-zoom-ipad-20260830
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Integrate cronometro resume layout') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate resume guard assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_bytes(path, old, new, label):
              p = Path(path)
              raw = p.read_bytes()
              for eol in ('\r\n', '\n'):
                  old_b = old.replace('\n', eol).encode('utf-8')
                  if old_b in raw:
                      new_b = new.replace('\n', eol).encode('utf-8')
                      p.write_bytes(raw.replace(old_b, new_b, 1))
                      return
              raise SystemExit(label + ': source snippet not found')

          replace_bytes(
              'index.html',
              '<link rel="stylesheet" href="study-session-ux.css?v=1">',
              '<link rel="stylesheet" href="study-session-ux.css?v=1">\n<link rel="stylesheet" href="crono-resume-layout.css?v=1">',
              'index css')
          replace_bytes(
              'index.html',
              '<script src="study-session-ux.js?v=1"></script>',
              '<script src="study-session-ux.js?v=1"></script>\n<script src="crono-resume-layout.js?v=1"></script>',
              'index js')
          replace_bytes(
              'sw.js',
              "const CACHE = 'estudio-v311';",
              "const CACHE = 'estudio-v312';",
              'service worker cache')
          replace_bytes(
              'sw.js',
              "  './study-session-ux.css?v=1',",
              "  './study-session-ux.css?v=1',\n  './crono-resume-layout.css?v=1',",
              'service worker css')
          replace_bytes(
              'sw.js',
              "  './study-session-ux.js?v=1',",
              "  './study-session-ux.js?v=1',\n  './crono-resume-layout.js?v=1',",
              'service worker js')
          PY
          echo 'Integrated diff:'
          git diff --numstat -- index.html sw.js
      - name: Install dependencies
        run: npm ci
      - name: Syntax and unit tests
        shell: bash
        run: |
          node --check app.js
          node --check crono-resume-layout.js
          npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Resume regression
        run: npx playwright test tests/e2e/crono-resume-layout.spec.js --project=chromium
      - name: Existing iPad timer regressions
        shell: bash
        run: |
          npx playwright test tests/e2e/crono-ipad-parent-overlap.spec.js --project=chromium
          npx playwright test tests/e2e/crono-readiness-ipad.spec.js --project=chromium
      - name: Commit integrated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Integrate cronometro resume layout"
          git push origin HEAD:fix/crono-stale-zoom-ipad-20260830
