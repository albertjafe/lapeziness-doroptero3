name: clean readiness ipad diff
on:
  push:
    branches:
      - fix/readiness-ipad-landscape-20260829
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original newline style without changing logical content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          for name in ('app.js', 'index.html', 'styles.css'):
              path = Path(name)
              desired = path.read_bytes().decode('utf-8').replace('\r\n', '\n').replace('\r', '\n')
              main_bytes = subprocess.check_output(['git', 'show', f'origin/main:{name}'])
              newline = '\r\n' if b'\r\n' in main_bytes else '\n'
              path.write_bytes(desired.replace('\n', newline).encode('utf-8'))
              print(name, '->', repr(newline))
          PY
          git diff --stat origin/main -- app.js index.html styles.css
      - name: Install dependencies
        run: npm ci
      - name: Re-run validated tests
        run: |
          node --check app.js
          node --check readiness-core.js
          npx vitest run tests/unit/readiness-core.test.js
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/crono-readiness-ipad.spec.js --project=chromium
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css
          git commit -m "Preserve original line endings in timer fix"
          git push origin HEAD:fix/readiness-ipad-landscape-20260829
