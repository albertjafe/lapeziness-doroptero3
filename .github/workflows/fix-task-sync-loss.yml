name: fix lossless task synchronization
on:
  push:
    branches:
      - fix/crono-task-sync-loss-20260831
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply task sync patch
        run: python scripts/apply_task_sync_fix.py
      - name: Inspect diff
        run: |
          git diff --stat
          git diff --numstat -- app.js data-core.js index.html sw.js tests/unit/data-core.test.js
      - name: Validate
        run: |
          npm ci
          node --check app.js
          node --check data-core.js
          npm run test:unit
          npm run check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js data-core.js index.html sw.js tests/unit/data-core.test.js
          git commit -m "Protect cronometro tasks during sync"
          git push origin HEAD:fix/crono-task-sync-loss-20260831
