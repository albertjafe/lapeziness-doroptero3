name: validate session guide and exact movement
on:
  push:
    branches:
      - fix/hecho-guide-last-movement-20260830
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Integrate session UX assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate new assets without line-ending churn
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_bytes(path, old, new, label):
              p = Path(path)
              raw = p.read_bytes()
              variants = [(b'\r\n', '\r\n'), (b'\n', '\n')]
              for eol_bytes, eol_text in variants:
                  old_b = old.replace('\n', eol_text).encode('utf-8')
                  if old_b in raw:
                      new_b = new.replace('\n', eol_text).encode('utf-8')
                      p.write_bytes(raw.replace(old_b, new_b, 1))
                      return
              raise SystemExit(label + ': source snippet not found')

          replace_bytes(
              'index.html',
              '<link rel="stylesheet" href="styles.css?v=281">',
              '<link rel="stylesheet" href="styles.css?v=281">\n<link rel="stylesheet" href="study-session-ux.css?v=1">',
              'index css')
          replace_bytes(
              'index.html',
              '<script src="app.js?v=280"></script>',
              '<script src="app.js?v=280"></script>\n<script src="study-session-ux.js?v=1"></script>',
              'index js')
          replace_bytes(
              'sw.js',
              "const CACHE = 'estudio-v310';",
              "const CACHE = 'estudio-v311';",
              'service worker cache')
          replace_bytes(
              'sw.js',
              "  './styles.css?v=281',",
              "  './styles.css?v=281',\n  './study-session-ux.css?v=1',",
              'service worker css')
          replace_bytes(
              'sw.js',
              "  './app.js?v=280',",
              "  './app.js?v=280',\n  './study-session-ux.js?v=1',",
              'service worker js')
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Syntax and unit tests
        shell: bash
        run: |
          node --check app.js
          node --check study-session-ux.js
          npm run test:unit
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Feature regressions
        run: npx playwright test tests/e2e/hecho-guide-last-movement.spec.js --project=chromium
      - name: Commit integrated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Integrate session UX assets"
          git push origin HEAD:fix/hecho-guide-last-movement-20260830
