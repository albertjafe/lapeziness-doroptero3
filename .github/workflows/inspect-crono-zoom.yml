name: inspect stale cronometro zoom
on:
  push:
    branches:
      - fix/crono-stale-zoom-ipad-20260830
permissions:
  contents: write
jobs:
  inspect:
    if: ${{ !startsWith(github.event.head_commit.message, 'Capture cronometro zoom diagnostics') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture relevant code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          patterns = ['cronoInitInterfaceZoom','InterfaceZoom','interfaceZoom','cronoZoom','crono-zoom','--crono','visualViewport','devicePixelRatio','zoom:','transform: scale','scale(']
          out=[]
          for name in ['app.js','styles.css','index.html','crono-readiness-layout.css','crono-idle-hierarchy.css']:
              p=Path(name)
              if not p.exists(): continue
              lines=p.read_text(errors='replace').splitlines()
              hits=[]
              for i,line in enumerate(lines):
                  if any(x in line for x in patterns): hits.append(i)
              if not hits: continue
              out.append('\n===== '+name+' =====\n')
              seen=set()
              for i in hits:
                  start=max(0,i-18); end=min(len(lines),i+35)
                  key=(start,end)
                  if any(a<=start and end<=b for a,b in seen): continue
                  seen.add(key)
                  out.append(f'--- lines {start+1}-{end} ---\n')
                  for j in range(start,end): out.append(f'{j+1:05d}: {lines[j]}\n')
          Path('_tmp_crono_zoom_diagnostic.txt').write_text(''.join(out))
          PY
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_crono_zoom_diagnostic.txt
          git commit -m "Capture cronometro zoom diagnostics"
          git push origin HEAD:fix/crono-stale-zoom-ipad-20260830
